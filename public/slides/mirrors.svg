<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Sunburst mirror">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E9DF"/>
      <stop offset="1" stop-color="#E7DDD1"/>
    </linearGradient>
    <radialGradient id="mirrorGlass" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="0.55" stop-color="#EFE7DC"/>
      <stop offset="1" stop-color="#D9CBB8"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C96A3B"/>
      <stop offset="1" stop-color="#96431F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <!-- sunburst rays -->
  <g stroke="#B4552D" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="800" y1="70" x2="800" y2="30"/>
    <line x1="800" y1="410" x2="800" y2="450"/>
    <line x1="560" y1="240" x2="520" y2="240"/>
    <line x1="1040" y1="240" x2="1080" y2="240"/>
    <line x1="630" y1="70" x2="606" y2="38"/>
    <line x1="970" y1="70" x2="994" y2="38"/>
    <line x1="630" y1="410" x2="606" y2="442"/>
    <line x1="970" y1="410" x2="994" y2="442"/>
    <line x1="688" y1="390" x2="668" y2="424"/>
    <line x1="912" y1="390" x2="932" y2="424"/>
    <line x1="688" y1="90" x2="668" y2="56"/>
    <line x1="912" y1="90" x2="932" y2="56"/>
  </g>

  <!-- mirror -->
  <circle cx="800" cy="240" r="145" fill="url(#frame)"/>
  <circle cx="800" cy="240" r="128" fill="url(#mirrorGlass)"/>
  <path d="M704 154 a128 128 0 0 1 116 -39 a175 175 0 0 0 -146 146 a128 128 0 0 1 30 -107 Z" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="800" cy="240" r="128" fill="none" stroke="#FAF6F0" stroke-width="4" opacity="0.6"/>

  <!-- side accents -->
  <g fill="#5B6650" opacity="0.5">
    <ellipse cx="300" cy="560" rx="10" ry="26" transform="rotate(-20 300 560)"/>
    <ellipse cx="330" cy="582" rx="8" ry="20" transform="rotate(15 330 582)"/>
    <ellipse cx="1300" cy="566" rx="10" ry="26" transform="rotate(20 1300 566)"/>
    <ellipse cx="1270" cy="586" rx="8" ry="20" transform="rotate(-15 1270 586)"/>
  </g>
</svg>
