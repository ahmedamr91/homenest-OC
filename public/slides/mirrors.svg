<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Mirrors collection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0E9DF"/>
      <stop offset="1" stop-color="#E7DDD1"/>
    </linearGradient>
    <radialGradient id="mirrorGlass" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="0.55" stop-color="#EFE7DC"/>
      <stop offset="1" stop-color="#D9CBB8"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C96A3B"/>
      <stop offset="1" stop-color="#96431F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <!-- sunburst rays -->
  <g stroke="#B4552D" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="800" y1="60" x2="800" y2="20"/>
    <line x1="800" y1="440" x2="800" y2="480"/>
    <line x1="540" y1="250" x2="500" y2="250"/>
    <line x1="1060" y1="250" x2="1100" y2="250"/>
    <line x1="616" y1="66" x2="592" y2="34"/>
    <line x1="984" y1="66" x2="1008" y2="34"/>
    <line x1="616" y1="434" x2="592" y2="466"/>
    <line x1="984" y1="434" x2="1008" y2="466"/>
    <line x1="676" y1="410" x2="656" y2="444"/>
    <line x1="924" y1="410" x2="944" y2="444"/>
    <line x1="676" y1="90" x2="656" y2="56"/>
    <line x1="924" y1="90" x2="944" y2="56"/>
  </g>

  <!-- mirror -->
  <circle cx="800" cy="250" r="150" fill="url(#frame)"/>
  <circle cx="800" cy="250" r="132" fill="url(#mirrorGlass)"/>
  <!-- glass sheen -->
  <path d="M700 160 a132 132 0 0 1 120 -40 a180 180 0 0 0 -150 150 a132 132 0 0 1 30 -110 Z" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="800" cy="250" r="132" fill="none" stroke="#FAF6F0" stroke-width="4" opacity="0.6"/>

  <!-- text -->
  <text x="800" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="10" fill="#96431F">STATEMENT MIRRORS</text>
  <text x="800" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="88" fill="#221B15">Reflect your <tspan font-style="italic" fill="#B4552D">style</tspan></text>

  <!-- side accents -->
  <g fill="#5B6650" opacity="0.5">
    <ellipse cx="330" cy="560" rx="10" ry="26" transform="rotate(-20 330 560)"/>
    <ellipse cx="360" cy="580" rx="8" ry="20" transform="rotate(15 360 580)"/>
    <ellipse cx="1260" cy="570" rx="10" ry="26" transform="rotate(20 1260 570)"/>
    <ellipse cx="1230" cy="588" rx="8" ry="20" transform="rotate(-15 1230 588)"/>
  </g>
</svg>
