  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g stroke="#4A3A2A" stroke-width="3">
    <line x1="540" y1="0" x2="540" y2="260"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
