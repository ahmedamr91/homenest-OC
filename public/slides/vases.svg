<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Vases on a shelf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF6F0"/>
      <stop offset="1" stop-color="#EFE5D8"/>
    </linearGradient>
    <linearGradient id="clayVase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C96A3B"/>
      <stop offset="0.5" stop-color="#B4552D"/>
      <stop offset="1" stop-color="#96431F"/>
    </linearGradient>
    <linearGradient id="mossVase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B7660"/>
      <stop offset="0.5" stop-color="#5B6650"/>
      <stop offset="1" stop-color="#49523F"/>
    </linearGradient>
    <linearGradient id="sandVase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3C6AE"/>
      <stop offset="0.5" stop-color="#D9B394"/>
      <stop offset="1" stop-color="#C69B78"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <!-- arches -->
  <path d="M300 700 V320 a180 180 0 0 1 360 0 V700 Z" fill="#E8C4B0" opacity="0.35"/>
  <path d="M940 700 V280 a200 200 0 0 1 400 0 V700 Z" fill="#B4552D" opacity="0.12"/>

  <!-- shelf -->
  <rect x="330" y="636" width="940" height="10" rx="5" fill="#D9CBB8"/>

  <!-- amphora -->
  <g>
    <path d="M490 636 c-40 -15 -55 -55 -42 -97 c10 -36 32 -53 27 -83 h50 c-5 30 17 47 27 83 c13 42 -2 82 -42 97 Z" fill="url(#clayVase)"/>
    <rect x="475" y="438" width="50" height="19" rx="6" fill="#96431F"/>
    <ellipse cx="507" cy="530" rx="10" ry="45" fill="#FAF6F0" opacity="0.25"/>
    <g stroke="#5B6650" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M500 426 C498 384 482 364 468 346"/>
      <path d="M514 426 C520 380 538 360 556 344"/>
      <path d="M507 426 C507 374 507 354 507 330"/>
    </g>
    <g fill="#5B6650">
      <ellipse cx="468" cy="342" rx="7" ry="12" transform="rotate(-30 468 342)"/>
      <ellipse cx="556" cy="340" rx="7" ry="12" transform="rotate(28 556 340)"/>
      <ellipse cx="507" cy="324" rx="7" ry="12"/>
    </g>
  </g>

  <!-- round belly vase -->
  <g>
    <path d="M800 636 c-72 0 -111 -45 -111 -105 c0 -63 47 -106 86 -106 l10 -27 h30 l10 27 c39 0 86 43 86 106 c0 60 -39 105 -111 105 Z" fill="url(#mossVase)"/>
    <ellipse cx="777" cy="524" rx="12" ry="54" fill="#FAF6F0" opacity="0.22"/>
    <g stroke="#B4552D" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M800 398 C796 350 778 326 760 304"/>
      <path d="M812 398 C822 344 844 322 866 306"/>
    </g>
    <g fill="#C96A3B">
      <circle cx="760" cy="300" r="8"/>
      <circle cx="866" cy="302" r="8"/>
      <circle cx="806" cy="356" r="6"/>
    </g>
  </g>

  <!-- bottle vase -->
  <g>
    <path d="M1090 636 c-45 0 -72 -31 -72 -76 c0 -37 21 -62 41 -72 l6 -86 h50 l6 86 c20 10 41 35 41 72 c0 45 -27 76 -72 76 Z" fill="url(#sandVase)"/>
    <ellipse cx="1073" cy="554" rx="9" ry="41" fill="#FAF6F0" opacity="0.3"/>
  </g>
</svg>
